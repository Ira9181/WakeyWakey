name: wakeywakey
description: A mission-based smart alarm app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State Management ---
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # --- Dependency Injection ---
  get_it: ^7.6.4

  # --- Database (Phase 6 mein add karenge) ---
  # isar: ^3.1.0+1
  # isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.1

  # --- Alarm & Notifications ---
  flutter_local_notifications: ^16.1.0
  # android_alarm_manager_plus: ^3.0.3  (Phase 4 mein)
  timezone: ^0.9.2

  # --- Permissions ---
  permission_handler: ^11.0.1

  # --- Audio ---
  just_audio: ^0.9.35

  # --- Missions (Phase 5 mein uncomment karenge) ---
  # camera: ^0.10.5+9
  # mobile_scanner: ^3.5.6
  # sensors_plus: ^4.0.2
  # pedometer: ^4.0.0
  # speech_to_text: ^6.3.0

  # --- Navigation ---
  go_router: ^12.1.1

  # --- UI ---
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  intl: ^0.18.1
  uuid: ^4.2.1

  # --- Error Handling ---
  dartz: ^0.10.1

  # --- Settings ---
  shared_preferences: ^2.2.2

  # --- AI Features ---
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # isar_generator: ^3.1.0+1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/animations/
